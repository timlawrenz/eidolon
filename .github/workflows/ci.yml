name: CI

# Enforcement, not decoration: this gate exists because the project's own rules
# (ledger citations resolve to tagged commits; evidence lives in the repo, not a
# scratch dir) were only a lint nobody ran. A rule without a gate is a wish.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    name: Governance & spec lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The lint asserts every ledger-cited SHA exists AND is reachable via
          # a tag, and that cited paths resolve in that commit. A shallow checkout
          # has neither the history nor the tags, so both are required.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-test.txt
      - name: Ledger/citation/workflow lint
        run: python -m pytest tests/tools/test_governance_sync.py -q

  tests:
    name: Shared-tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-test.txt
      - name: Run judged suite (excludes known-failing — issue #3)
        run: bash ci/run_tests.sh
