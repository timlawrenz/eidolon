  - refit-cleaned refit the identity basis. This arm touches the GEOMETRY stream and
    changes no encoder.
  - zg-token-basis-cfg-guard (prx-tg) fixed how z_g TOKENS are fed. This asks whether
    the values being fed are trustworthy.
  - No training in this arm. CPU-only.

