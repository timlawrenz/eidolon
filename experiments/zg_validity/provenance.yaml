arm: zg-validity-threshold
branch: exp/zg-validity
status: PRE-REGISTERED — NOT YET RUN

hypothesis: >
  Per-image z_g vectors in hegre_corpus with norm > 25 are DWPose/encoder failures
  (the claim made by the comment at extract_zg_and_averages.py L130) rather than
  genuine pose/expression extremity, and therefore warrant a validity filter applied
  to the shipped per-image vectors rather than only to persona averages.

  Competing hypothesis, which this arm must be able to prefer:
  high-norm z_g is genuine extremity that frontalization failed to remove. z_g is
  whitened PCA ((raw - whiten_mu) / whiten_sigma), so whitening amplifies the
  low-variance high-index components; a sample with large residual pose after
  frontalization projects far along those axes. The ledger's 2026-07-07 note that
  z_g -> yaw R^2 = 0.98 makes this live: z_g demonstrably carries pose.

  Discriminator: the DWPose keypoints behind each vector, NOT the norm itself.

falsified_if: >
  F1. G0 fails: corpus z_g is not bit-identical to the zg/ source tree. Then every
      downstream conclusion is about a copy, not the encoder, and the arm aborts.
  F2. G1 shows >=70% of high-norm samples have PLAUSIBLE keypoints (H2). Then the
      docstring claim "norm > 25 = degenerate" is falsified and the correct action is
      to change nothing in the data.
  F3. G2 shows keypoint quality is equal between high-norm and control but pose
      amplitude is larger. Same conclusion as F2, reached quantitatively.
  F4. No criterion satisfying G4.1 (computable per-image at inference time) separates
      the two populations. Then no defensible filter exists, regardless of mechanism.

pre_registered_gate: >
  G0 (INSTRUMENT TRUST, run first, abort if it fails): hegre_corpus z_g.npy is
  bit-identical to the zg/ source tree on this arm's own sample. Previously
  established over 600 matched samples at ||diff|| = 0.00000000; re-confirm.

  G1 (MECHANISM, VISUAL — the core question): 60 images at norm > 25 and 60 controls
  at norm 8-12, DWPose 68 keypoints rendered over the pixel, each classified
  plausible vs implausible. Pre-registered decision rule:
    - >=70% of high-norm IMPLAUSIBLE  -> H1 (detector failure); a filter is justified
    - >=70% of high-norm PLAUSIBLE    -> H2 (genuine extremity); NO filter
    - in between                      -> MIXED; criterion must be keypoint-based
  Visual verification is mandatory (standing project rule; Phase 2b z_a precedent).

  G2 (QUANTITATIVE CORROBORATION, independent of the visual): high-norm vs control on
  per-keypoint confidence, missing-point count, inter-ocular distance in normalized
  units, keypoint-bbox scale/aspect. Direction test: worse keypoint quality -> H1;
  equal quality with larger pose amplitude -> H2. Report effect sizes WITH confidence
  intervals, not bare significance.

  G3 (FALSIFICATION OF THE STANDING CLAIM): if H2 holds, "norm > 25 = degenerate" is
  falsified. Retire the claim AND re-examine the persona-average filter it drives,
  since persona averages may have been computed over a biased subsample.

  G4 (THE DECISION): any chosen criterion must be (1) computable per-image from data
  available at inference time, so train and inference paths agree; (2) applied
  identically to all splits so it cannot become a split confound; (3) justified by a
  falsifiable measurement, not a round number. The <15 (2026-07-07 cohort cap) vs
  >25 (extraction docstring) discrepancy must be reconciled explicitly — at most one
  can be right, and neither being right must be on the table.

  G5 (IF THE CORPUS CHANGES): governed as a data update. Backup before the first
  write, never overwrite an existing backup, idempotent and resumable, stamped with
  the basis fingerprint, _manifest.json updated, count delta reported, and the
  train/val/test split re-hashed (a filter changes split membership).

kill_condition: >
  If high-norm samples are visually valid with valid keypoints AND their z_g carries
  genuine pose signal, the premise collapses: change nothing in the data, retire the
  docstring claim, and write DISCONTINUATION_NOTICE.md so the filter is not
  re-attempted. A KILL here is a valuable result — it removes a wrong belief and
  simplifies the architecture.

