# Config — arm `zg-identity-blindness`
# Pre-registered 2026-09-24 BEFORE the first run.

arm: zg-identity-blindness
mode: confirmatory

data:
  corpus: /mnt/nas-ai-models/training-data/eidolon/hegre_corpus
  source_root: /mnt/nas-ai-models/training-data/eidolon/hegre-faces/v1
  zg_source_tree: /mnt/nas-ai-models/training-data/eidolon/geometry_pca_data/zg
  arrays: [z_g.npy, auraface_lda.npy, metadata.json]
  pose: stratum/{persona}/{set}/{image_id}/pose.npy
  face_slice: [23, 91]           # 68 face keypoints of the 133 DWPose whole-body
  expected_samples: 31711
  expected_personas: 321

instrument:
  metric: global_fisher_j           # J = S_B / S_W
  implementation: experiments/geometry_pca/geometry_pca/fisher.py::fisher_ratios
  restandardize_variants: true      # report raw AND per-component z-scored J
  min_samples_per_identity: 2       # within-scatter undefined below this

venues:
  A: 0.0    # no confidence filter
  B: 0.3    # primary
  C: 0.5
  primary: B

gates:
  g0_n: 400
  g0_require: {max_abs_diff: 0.0, missing_source: 0}
  g1_require_ratio: 3.0             # J_auraface >= 3x J_zg
  g2_confirm: {J_min: 0.02, J_max: 0.12, morph_axes_max: 10}
  g2_falsify: {J_min: 0.20, morph_axes_min: 20}

seed: 20260924
compute: cpu                       # no GPU, no model
outputs:
  metrics: output/fisher_metrics.json

execution:
  command: .venv/bin/python experiments/zg_identity_blindness/src/run_fisher.py all --out experiments/zg_identity_blindness/output/fisher_metrics.json
