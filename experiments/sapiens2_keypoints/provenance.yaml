arm: sapiens2-keypoints
hypothesis: >
  Sapiens2's dense, confidence-scored pose keypoints (308 2D landmarks + per-point
  confidence, 1B checkpoint) are (a) more FAITHFUL than DWPose — they measure
  rather than hallucinate — and (b) a stronger identity carrier in cross-shoot
  verification than the 68-pt DWPose landmarks that z_g is built from.
falsified_if: >
  Sapiens2 2D shape AUC ≤ DWPose 2D shape AUC in cross-shoot verification.
  Or: Sapiens2 within-person config scatter ≥ DWPose (if it's not actually
  more stable).
pre_registered_gate: >
  G1 (Faithfulness): "PASS if Sapiens2 per-keypoint confidence discriminates
  seen vs unseen landmarks, AND within-person config scatter < DWPose."
  G2 (Identity 2D): "PASS if Sapiens2 2D shape AUC > DWPose 2D shape AUC."
  G3 (Identity 3D): "PASS if Sapiens2 3D-frontalized shape carries complementary
  or stronger identity signal vs documented z_g (0.67–0.69)."
  Secondary: Fisher-J axis split to test whether Sapiens2 shape has an
  identity-blind transient block (required for z_g replacement).
differs_from: zg-posenorm
diff_summary: |
  - DWPose 68-pt landmarks → Sapiens2 308-pt landmarks (dense, confidence-scored)
  - Tests faithfulness (seen vs unseen confidence, config scatter) AND identity
  - 3D frontalization tested both via measured-GPA and z_g template-lift (confound control)
  - Fisher-J split on mixed-zg cohort to test identity-blindness
